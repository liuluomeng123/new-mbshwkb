<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <!-- 背景 -->
  <rect width="400" height="300" fill="#f8f9fc" />
  
  <!-- 产品图标 - 数据可视化工具 -->
  <circle cx="200" cy="120" r="60" fill="#f6c23e" />
  
  <!-- 图表图标 -->
  <rect x="170" y="100" width="60" height="40" fill="white" rx="5" />
  
  <!-- 柱状图 -->
  <rect x="175" y="120" width="10" height="15" fill="#4e73df" />
  <rect x="190" y="110" width="10" height="25" fill="#4e73df" />
  <rect x="205" y="105" width="10" height="30" fill="#4e73df" />
  <rect x="220" y="115" width="10" height="20" fill="#4e73df" />
  
  <!-- 数据点 -->
  <circle cx="180" cy="90" r="5" fill="#e74a3b" />
  <circle cx="200" cy="85" r="5" fill="#e74a3b" />
  <circle cx="220" cy="95" r="5" fill="#e74a3b" />
  
  <!-- 连线 -->
  <path d="M180,90 L200,85 L220,95" stroke="#e74a3b" stroke-width="2" fill="none" />
  
  <!-- 产品名称 -->
  <text x="200" y="220" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#5a5c69">数据可视化工具</text>
  
  <!-- 产品简介 -->
  <text x="200" y="250" font-family="Arial" font-size="14" text-anchor="middle" fill="#858796">强大的数据分析和可视化解决方案</text>
</svg>