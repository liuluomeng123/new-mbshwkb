<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- 背景 -->
  <rect width="200" height="200" fill="#ffffff" />
  
  <!-- 二维码模拟图案 -->
  <rect x="40" y="40" width="120" height="120" fill="#ffffff" stroke="#333333" stroke-width="2" />
  
  <!-- 二维码方块模拟 -->
  <!-- 左上角定位点 -->
  <rect x="50" y="50" width="30" height="30" fill="#333333" />
  <rect x="55" y="55" width="20" height="20" fill="#ffffff" />
  <rect x="60" y="60" width="10" height="10" fill="#333333" />
  
  <!-- 右上角定位点 -->
  <rect x="120" y="50" width="30" height="30" fill="#333333" />
  <rect x="125" y="55" width="20" height="20" fill="#ffffff" />
  <rect x="130" y="60" width="10" height="10" fill="#333333" />
  
  <!-- 左下角定位点 -->
  <rect x="50" y="120" width="30" height="30" fill="#333333" />
  <rect x="55" y="125" width="20" height="20" fill="#ffffff" />
  <rect x="60" y="130" width="10" height="10" fill="#333333" />
  
  <!-- 微信图标 -->
  <circle cx="100" cy="100" r="15" fill="#07C160" />
  <path d="M92,100 Q100,108 108,100 Q100,92 92,100 Z" fill="#ffffff" />
  <path d="M95,96 Q100,101 105,96" stroke="#ffffff" stroke-width="2" fill="none" />
  
  <!-- 随机二维码点阵 -->
  <rect x="90" y="60" width="5" height="5" fill="#333333" />
  <rect x="100" y="65" width="5" height="5" fill="#333333" />
  <rect x="85" y="70" width="5" height="5" fill="#333333" />
  <rect x="95" y="75" width="5" height="5" fill="#333333" />
  <rect x="105" y="80" width="5" height="5" fill="#333333" />
  <rect x="80" y="85" width="5" height="5" fill="#333333" />
  <rect x="90" y="90" width="5" height="5" fill="#333333" />
  <rect x="110" y="95" width="5" height="5" fill="#333333" />
  <rect x="75" y="100" width="5" height="5" fill="#333333" />
  <rect x="85" y="105" width="5" height="5" fill="#333333" />
  <rect x="95" y="110" width="5" height="5" fill="#333333" />
  <rect x="105" y="115" width="5" height="5" fill="#333333" />
  <rect x="115" y="120" width="5" height="5" fill="#333333" />
  <rect x="70" y="70" width="5" height="5" fill="#333333" />
  <rect x="110" y="70" width="5" height="5" fill="#333333" />
  <rect x="70" y="110" width="5" height="5" fill="#333333" />
</svg>