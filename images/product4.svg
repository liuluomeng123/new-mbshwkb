<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <!-- 背景 -->
  <rect width="400" height="300" fill="#f8f9fc" />
  
  <!-- 产品图标 - 移动学习平台 -->
  <circle cx="200" cy="120" r="60" fill="#1cc88a" />
  
  <!-- 移动设备图标 -->
  <rect x="175" y="80" width="50" height="80" rx="5" fill="white" />
  <rect x="180" y="85" width="40" height="60" fill="#f8f9fc" />
  <circle cx="200" cy="155" r="5" fill="white" />
  
  <!-- 学习图标 -->
  <rect x="185" y="95" width="30" height="5" fill="#4e73df" />
  <rect x="185" y="105" width="20" height="5" fill="#4e73df" />
  <rect x="185" y="115" width="25" height="5" fill="#4e73df" />
  <rect x="185" y="125" width="15" height="5" fill="#4e73df" />
  
  <!-- 学习图标 - 书本 -->
  <path d="M215,100 L225,95 L225,115 L215,120 Z" fill="#f6c23e" />
  <path d="M215,100 L205,95 L205,115 L215,120 Z" fill="#e74a3b" />
  
  <!-- 产品名称 -->
  <text x="200" y="220" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#5a5c69">移动学习平台</text>
  
  <!-- 产品简介 -->
  <text x="200" y="250" font-family="Arial" font-size="14" text-anchor="middle" fill="#858796">面向学生和教育工作者的移动学习解决方案</text>
</svg>